<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RMHS Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --board: #A9764C;
    --frame: #6B4A2E;
    --wall: #EFE9DD;
    --ink: #241A12;
    --paper: #FBF5E9;
    --academics: #2C4A6E;
    --events: #00CC00;
    --urgent: #96201C;
    --focus: #FFD86B;
    --science: #C0C0C0;
    --math: #FFD300;
    --english: #2b68e2;
    --filipino: #FFB6C1;
    --ap: #000000;
    --tle: #0A6522;
    --ve: #FF007F;
    --mapeh: #6A0DAD;
  }

  * { box-sizing: border-box; }
  [hidden] {
    display: none !important;
 }

  body {
    margin: 0;
    background: var(--wall);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
    animation: fadeIn 0.5s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* ---------- Header ---------- */
  .site-header {
    background: var(--ink);
    color: var(--paper);
    padding: 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .brand { display: flex; align-items: center; gap: 0.75rem; }

  .brand .pin-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--paper);
    box-shadow: 0 2px 3px rgba(0,0,0,0.5);
    flex-shrink: 0;
  }

  .brand h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-weight: 400;
    font-size: 2.2rem;
    letter-spacing: 0.04em;
    margin: 0;
    line-height: 1;
  }

  .brand .tagline { margin: 0.2rem 0 0; font-size: 0.85rem; opacity: 0.75; }

  .today {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    opacity: 0.8;
    text-align: right;
  }

  /* ---------- Controls ---------- */
  .controls {
    max-width: 1100px;
    margin: 0 auto;
    padding: 1.25rem 1.5rem 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .filters { display: flex; gap: 0.5rem; flex-wrap: wrap; }

  .filter-btn {
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    border: 2px solid var(--ink);
    background: transparent;
    color: var(--ink);
    padding: 0.4rem 0.9rem;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
  }

  .filter-btn:hover { transform: translateY(-1px); }
  .filter-btn:active { transform: scale(0.95); }

  .filter-btn[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

  .filter-btn.urgent-filter { border-color: var(--urgent); color: var(--urgent); }
  .filter-btn.urgent-filter[aria-pressed="true"] { background: var(--urgent); color: var(--paper); }

  .search-bar {
    font-family: 'Work Sans', sans-serif;
    font-size: 0.9rem;
    padding: 0.5rem 1rem;
    border-radius: 999px;
    border: 2px solid var(--frame);
    background: var(--paper);
    color: var(--ink);
    min-width: 200px;
  }

  /* ---------- The board ---------- */
  .board {
    max-width: 1100px;
    margin: 1.5rem auto 3rem;
    padding: 2.5rem 2rem;
    border: 10px solid var(--frame);
    border-radius: 6px;
    background-color: var(--board);
    background-image:
      radial-gradient(circle at 10% 20%, rgba(0,0,0,0.08) 0, transparent 2%),
      radial-gradient(circle at 80% 15%, rgba(0,0,0,0.07) 0, transparent 2.5%),
      radial-gradient(circle at 35% 65%, rgba(0,0,0,0.06) 0, transparent 2%),
      radial-gradient(circle at 70% 85%, rgba(0,0,0,0.08) 0, transparent 3%),
      radial-gradient(circle at 50% 45%, rgba(0,0,0,0.05) 0, transparent 2%),
      radial-gradient(circle at 90% 55%, rgba(255,255,255,0.06) 0, transparent 2%),
      radial-gradient(circle at 15% 88%, rgba(255,255,255,0.06) 0, transparent 2.5%);
    background-size: 160px 160px;
    box-shadow: inset 0 2px 14px rgba(0,0,0,0.3);
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 2rem 1.5rem;
    min-height: 200px;
  }

  .card {
    background: var(--paper);
    border-radius: 2px;
    padding: 1.5rem 1.25rem 1.25rem;
    box-shadow: 0 10px 18px -6px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.2);
    position: relative;
    transform: rotate(var(--r, -1deg));
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    cursor: pointer;
    animation: cardPop 0.3s ease backwards;
  }

  @keyframes cardPop {
    from { opacity: 0; transform: scale(0.92) rotate(var(--r, -1deg)); }
    to { opacity: 1; transform: scale(1) rotate(var(--r, -1deg)); }
  }

  .card:hover, .card:focus-visible {
    transform: rotate(0deg) translateY(-3px);
    box-shadow: 0 16px 24px -6px rgba(0,0,0,0.45), 0 3px 6px rgba(0,0,0,0.25);
  }

  .card::before {
    content: '';
    position: absolute;
    top: -9px;
    left: 50%;
    transform: translateX(-50%);
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--pin, var(--ink));
    box-shadow: 0 3px 4px rgba(0,0,0,0.45);
  }

  .card--academics { --pin: var(--academics); }
  .card--events { --pin: var(--events); }
  .card--urgent { --pin: var(--urgent); }
  .card--urgent::before { animation: pulse 2s ease-in-out infinite; }
  .card--science { --pin: var(--science); }
  .card--math { --pin: var(--math); }
  .card--english { --pin: var(--english); }
  .card--filipino { --pin: var(--filipino); }
  .card--ap { --pin: var(--ap); }
  .card--tle { --pin: var(--tle); }
  .card--ve { --pin: var(--ve); }
  .card--mapeh { --pin: var(--mapeh); }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 3px 4px rgba(0,0,0,0.45), 0 0 0 0 rgba(150,32,28,0.5); }
    50% { box-shadow: 0 3px 4px rgba(0,0,0,0.45), 0 0 0 6px rgba(150,32,28,0); }
  }

  .card-tag {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--paper);
    background: var(--pin, var(--ink));
    padding: 0.2rem 0.55rem;
    border-radius: 3px;
    margin-bottom: 0.6rem;
  }

  .card--events .card-tag,
  .card--science .card-tag,
  .card--math .card-tag,
  .card--filipino .card-tag {
    color: var(--ink);
  }

  .card h3 {
    font-family: 'Bebas Neue', sans-serif;
    font-weight: 400;
    font-size: 1.5rem;
    letter-spacing: 0.02em;
    margin: 0 0 0.35rem;
    line-height: 1.1;
  }

  .card time { display: block; font-size: 0.75rem; opacity: 0.6; margin-bottom: 0.6rem; }
  .card p { font-size: 0.9rem; line-height: 1.45; margin: 0; white-space: pre-line; }

  .empty-state { max-width: 1100px; margin: 2rem auto; text-align: center; opacity: 0.6; font-size: 0.95rem; animation: fadeIn 0.3s ease; }
  
  .site-footer {
    text-align: center;
	padding: 1.5rem 1rem 2.5rem;
	font-size: 0.8rem;
	line-height: 1.6rem;
	color: var(--ink);
	opacity: 0.6;
  }

  /* ---------- Materials ---------- */
  .section-tabs{
    display:flex;
    justify-content:center;
    gap:12px;
    margin:20px 0;
  }

  .tab-btn{
    font-family:'Bebas Neue', sans-serif;
    font-size:1.2rem;
    letter-spacing:.05em;
    padding:10px 28px;
    border:2px solid var(--ink);
    border-radius:999px;
    background:var(--paper);
    color:var(--ink);
    cursor:pointer;
    transition:.2s ease;
  }

  .tab-btn:hover{
    transform:translateY(-2px);
    background:#f4ecdc;
  }

  .tab-btn:active{
    transform: scale(0.95);
  }

  .tab-btn.active{
    background:var(--ink);
    color:var(--paper);
  }

  .section-enter {
    animation: sectionIn 0.35s ease;
  }

  @keyframes sectionIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---------- Modal ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(36,26,18,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    z-index: 10;
    animation: fadeIn 0.2s ease;
  }

  .modal {
    background: var(--paper);
    max-width: 700px;
    width: 100%;
    max-height: 85vh;
    border-radius: 3px;
    padding: 2rem 1.75rem 1.75rem;
    position: relative;
    box-shadow: 0 24px 48px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    animation: modalPop 0.25s ease;
  }

  @keyframes modalPop {
    from { opacity: 0; transform: scale(0.95) translateY(8px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .modal-scroll {
    overflow-y: auto;
    min-height: 0;
  }

  .modal::before {
    content: '';
    position: absolute;
    top: -9px;
    left: 50%;
    transform: translateX(-50%);
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--pin, var(--ink));
    box-shadow: 0 3px 4px rgba(0,0,0,0.45);
  }

  .modal-close {
    position: absolute;
    top: 0.75rem;
    right: 0.9rem;
    background: none;
    border: none;
    font-size: 1.5rem;
    line-height: 1;
    cursor: pointer;
    color: var(--ink);
    opacity: 0.5;
    transition: opacity 0.15s ease;
  }
  .modal-close:hover { opacity: 0.9; }

  .modal h2 { font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 2rem; margin: 0 0 0.25rem; }
  .modal-date { font-size: 0.8rem; opacity: 0.6; margin: 0 0 1rem; }
  .card p a, .modal-body a {
    color: var(--academics);
    font-weight: 600;
    text-decoration: underline;
  }
  .card p a:hover, .modal-body a:hover { opacity: 0.7; }

  .modal-body { font-size: 0.95rem; line-height: 1.6; margin: 0; white-space: pre-line; }

  button:focus-visible, input:focus-visible, .card:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }

  @media (max-width: 640px) {
    .site-header { padding: 1.25rem 1rem; }
    .brand h1 { font-size: 1.7rem; }
    .board { padding: 1.75rem 1rem; border-width: 6px; gap: 1.5rem 1rem; }
    .controls { padding: 1rem 1rem 0; }
    .search-bar {
	  width: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>

    body:`POINTERS TO REVIEW: ENGLISH 9

1. Elements of Poetry

☑️Theme: Central idea, message, or underlying meaning of a poem.

☑️Stanza: A group of lines forming a division or unit within a poem.

☑️Meter & Rhythm: 

🔹Meter is the structured pattern of stressed and unstressed syllables; 

🔹Rhythm is created by recurring sound patterns, words, or phrases.

☑️Tone vs. Persona: 

🔹Tone reflects the poet's/speaker's attitude toward the subject, while Persona is the speaker or voice created by the author.

☑️Imagery: Descriptive words or phrases that appeal to the five physical senses.

👁️Visual (Sight): Describes how things look, including colors, shapes, patterns, and light (e.g., "the golden sunset painted the sky").

👂🏻Auditory (Sound): Relates to what you hear, such as noises, music, or voices (e.g., "the thunder roared across the valley").

👃🏻Olfactory (Smell): Involves scents and aromas (e.g., "the aroma of fresh bread filled the air").

👄😋Gustatory (Taste): Describes flavors like sweet, sour, salty, or spicy (e.g., "the lemon was sour on my tongue").

🤚🏻Tactile (Touch): Concerns textures and temperatures, like rough, smooth, hot, or cold (e.g., "the velvet felt soft under my fingers").

🍒🍒🍒Advanced Types of Imagery

🤸🏻‍♀️🏇🏻⛹🏻‍♀️Kinesthetic (Movement): Creates the sensation of motion or physical action.

🩷🫂Organic (Internal Feelings): Describes internal bodily sensations or emotions like hunger, fear, or fatigue.

✨Figures of Speech:

🎀Alliteration: Repetition of initial consonant sounds in nearby words.

🎀Metaphor: Direct comparison of two unlike things without using "like" or "as" (e.g., "Her voice is music to my ears").

🎀Personification: Giving human qualities or actions to non-human objects or abstract ideas (e.g., "The moon smiled down...").

🎀Symbolism: Use of symbols (like a "road" representing a life journey) to convey deeper meanings.

2. Elements of Drama & One-Act Plays

☑️Structure: A one-act play consists of a single act.

☑️Setting: Time, place, and environment where the story or scene takes place.

☑️Plot Structure:
Exposition: Introduces characters, setting, and initial situation.

☑️Rising Action: Escalates the main problem/conflict.

☑️Climax: Peak intensity, high point, or turning point of the play.

☑️Resolution: Concluding part showing how the main conflict is settled.

☑️Conflict: Main problem or struggle faced by characters (e.g., internal conflict, character vs. character, individual desire vs. family loyalty).

📌Character Types:

🔹Protagonist: Main character or central figure.

🔹Antagonist: Character or force opposing the main character.

3. Scriptwriting & 
Dramatic Techniques

✨Essential Script Elements: Dialogue (spoken lines between characters) and Stage Directions.

✨Stage Directions: Written instructions in parentheses/brackets or italics guiding actors' movements, facial expressions, tone, and positioning (e.g., "(Lena nervously taps her fingers on the table)").

✨Functions of Dialogue: Reveals character traits/personalities (characterization), advances plot action, and shows conflict.

✨Dramatic Tension: Created through a combination of setting details, stage directions, and character dialogue/internal conflict.

4. Literature: Romeo and Juliet

Author: William Shakespeare.

🌞Key Characters & Alliances:
🔹Romeo: Belongs to the Montague family.
🔹Juliet: Belongs to the Capulet family.
🔹Benvolio: Romeo's close friend and cousin.
🔹Tybalt: Juliet's cousin, Romeo's sworn enemy.
🔹Mercutio: Romeo's friend whose death prompts Romeo to seek revenge against Tybalt.

🗝️Major Plot Points:
🌷First Meeting: Romeo attends the Capulet masquerade ball to see Rosaline, where he meets Juliet.

🌷Banishment: Romeo is banished from Verona for killing Tybalt.

    title:"MAPEH LESSONS TO REVIEW",
    subject:"mapeh",
    date:"2026-09-01",
    excerpt:"Lessons for Term 1 Exam",
    body:"lesson content"
  }
	];

  const board = document.getElementById('board');
  const emptyState = document.getElementById('emptyState');
  const searchInput = document.getElementById('searchInput');
  const materialSearch = document.getElementById('materialSearch');
  const materialsEmptyState = document.getElementById('materialsEmptyState');
  const filterButtons = document.querySelectorAll('.filters button[data-category]');
  const modalOverlay = document.getElementById('modalOverlay');
  const modalClose = document.getElementById('modalClose');

  let activeCategory = 'all';
  let searchTerm = '';
  let lastFocusedCard = null;

  const categoryLabels = {
    academics: 'Academics',
    events: 'Events',
    urgent: 'Urgent'
  };
  
  const subjectLabels = {
    science:"Science",
    math:"Math",
    english:"English",
    filipino:"Filipino",
    ap:"Araling Panlipunan",
    tle:"TLE",
    ve:"Values Education",
    mapeh:"MAPEH"
  };

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function linkify(text) {
    const urlPattern = /(https?:\/\/[^\s]+)/g;
    return text.split(urlPattern).map((part, i) => {
      if (i % 2 === 1) {
        const safeUrl = escapeHtml(part);
        return `<a href="${safeUrl}" target="_blank" rel="noopener noreferrer">Open link ↗</a>`;
      }
      return escapeHtml(part);
    }).join('');
  }

  function formatDate(iso) {
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function updateTodayDisplay() {
    document.getElementById('todayDate').textContent =
      new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  }

  function render() {
    const term = searchTerm.toLowerCase();
    const filtered = announcements.filter(a => {
      const matchesCategory = activeCategory === 'all' || a.category === activeCategory;
      const matchesSearch = (a.title + ' ' + a.excerpt).toLowerCase().includes(term);
      return matchesCategory && matchesSearch;
    });

    board.innerHTML = '';
    filtered.forEach((a, i) => {
      const card = document.createElement('article');
      card.className = `card card--${a.category}`;
      card.style.setProperty('--r', `${((i % 5) - 2) * 0.6}deg`);
      card.style.animationDelay = `${i * 0.04}s`;
      card.tabIndex = 0;
      card.setAttribute('role', 'button');
      card.setAttribute('aria-label', `Open announcement: ${a.title}`);
      card.innerHTML = `
        <span class="card-tag">${categoryLabels[a.category]}</span>
        <h3>${escapeHtml(a.title)}</h3>
        <time datetime="${a.date}">${formatDate(a.date)}</time>
        <p>${linkify(a.excerpt)}</p>
      `;
      card.addEventListener('click', () => openModal(a, card));
      card.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(a, card); }
      });
      board.appendChild(card);
    });

    emptyState.hidden = filtered.length !== 0;
  }

let activeSubject = "all";
let materialSearchTerm = "";

function renderMaterials(){

    const board = document.getElementById("materialsBoard"); board.innerHTML = "";
    const term = materialSearchTerm.toLowerCase();
    const filtered = materials.filter(m => {
	
        const matchesSubject =
            activeSubject === "all" ||
            m.subject === activeSubject;

        const matchesSearch =
            (m.title + " " + m.excerpt)
            .toLowerCase()
            .includes(term);

        return matchesSubject && matchesSearch;

    });

    filtered.forEach((m,i)=>{

        const card=document.createElement("article");

        card.className=`card card--${m.subject}`;

        card.style.setProperty(
            "--r",
            `${((i%5)-2)*0.6}deg`
        );

        card.style.animationDelay = `${i * 0.04}s`;

        card.tabIndex = 0;
        card.setAttribute('role', 'button');
        card.setAttribute('aria-label', `Open material: ${m.title}`);

        card.innerHTML=`
            <span class="card-tag">
                ${subjectLabels[m.subject]}
            </span>

            <h3>${escapeHtml(m.title)}</h3>

            <time datetime="${m.date}">${formatDate(m.date)}</time>

            <p>${linkify(m.excerpt)}</p>
        `;

        const openThisMaterial = () => openModal({
            title:m.title,
            body:m.body,
            date:m.date,
            category:m.subject
        },card);

        card.addEventListener('click', openThisMaterial);
        card.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openThisMaterial(); }
        });

        board.appendChild(card);

    });

    materialsEmptyState.hidden = filtered.length !== 0;

 }

  function openModal(a, triggerEl) {
    lastFocusedCard = triggerEl;
    document.getElementById('modalTag').textContent = categoryLabels[a.category] || subjectLabels[a.category]; 
    document.getElementById('modalTitle').textContent = a.title;
    document.getElementById('modalDate').textContent = formatDate(a.date);
    document.getElementById('modalBody').innerHTML = linkify(a.body);
    document.querySelector('.modal').className = `modal card--${a.category}`;
    modalOverlay.hidden = false;
    modalClose.focus();
  }

  function closeModal() {
    modalOverlay.hidden = true;
    if (lastFocusedCard) lastFocusedCard.focus();
  }

  modalClose.addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modalOverlay.hidden) closeModal(); });

filterButtons.forEach(btn => {
    btn.addEventListener('click', () => {

        if (!btn.dataset.category) return;

        activeCategory = btn.dataset.category;

        filterButtons.forEach(b =>
            b.setAttribute('aria-pressed', b === btn ? 'true' : 'false')
        );

        render();
    });
});

const subjectButtons = document.querySelectorAll(
    "#materialsSection button[data-subject]"
);

subjectButtons.forEach(btn => {

    btn.addEventListener("click", () => {

        activeSubject = btn.dataset.subject;

        subjectButtons.forEach(b =>
            b.setAttribute("aria-pressed", b === btn ? "true" : "false")
        );

        renderMaterials();

    });

});

  searchInput.addEventListener('input', e => { searchTerm = e.target.value; render(); });
  
  materialSearch.addEventListener("input", e => {

    materialSearchTerm = e.target.value;

    renderMaterials();

});


const tabs=document.querySelectorAll(".tab-btn");

tabs.forEach(tab=>{

    tab.onclick=()=>{

        tabs.forEach(t=>t.classList.remove("active"));

        tab.classList.add("active");

        document.getElementById("announcementSection").hidden =
            tab.dataset.section!=="announcements";

        document.getElementById("materialsSection").hidden =
            tab.dataset.section!=="materials";

        if(tab.dataset.section==="materials")
            renderMaterials();

    };

});

  updateTodayDisplay();
  render(); 
</script>
</body>
</html>
